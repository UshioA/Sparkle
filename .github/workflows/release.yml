name: Release

# 发布流程（fork 版）：
#   - 打 tag（不带 v 前缀，如 1.26.9）或手动触发
#   - 版本号规则见 README：必须大于上游版本，取 max(上游, 当前) + 1 个 patch
#   - 产出的 Release 必须是非 prerelease，因为应用内更新走 /releases/latest/download/latest.yml
on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本（如 1.26.9），需与 package.json 一致'
        required: true
        type: string
      tag:
        description: '发布使用的 tag，默认等于 version'
        required: false
        type: string
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Determine and validate version
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -e
          if [[ "$EVENT_NAME" == "push" ]]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="${INPUT_VERSION#v}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号必须是 x.y.z，收到: $VERSION"
            exit 1
          fi

          PKG_VERSION=$(jq -r '.version' package.json)
          if [[ "$PKG_VERSION" != "$VERSION" ]]; then
            echo "::error::package.json 版本是 $PKG_VERSION，与要发布的 $VERSION 不一致。请先把 package.json 改成 $VERSION 再打 tag。"
            exit 1
          fi

          # fork 的版本号必须大于上游，否则 deb 会被 apt 判为降级（electron-builder 会把
          # 预发布版本写成 1.26.8~x365.1，而 ~ 排序低于一切），Sparkle 的字符串比较也认不出更新。
          if [[ -n "${{ inputs.version }}" && -n "$INPUT_TAG" ]]; then
            TARGET_TAG="$INPUT_TAG"
          else
            TARGET_TAG="$VERSION"
          fi
          git check-ref-format "refs/tags/$TARGET_TAG"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [prepare]
    uses: ./.github/workflows/build.yml
    with:
      channel: stable
      version: ${{ needs.prepare.outputs.version }}
      release_tag: ${{ needs.prepare.outputs.tag }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.1 --activate

      - name: Generate Changelog
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -e
          PREV=$(git tag --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${VERSION}$" | head -1 || true)
          if [[ -n "$PREV" ]]; then RANGE="${PREV}..HEAD"; else RANGE="HEAD"; fi
          {
            echo "# ${VERSION}"
            echo
            echo "本构建内置**官方 mihomo 内核**；第三方内核请以「系统内核」方式接入（见 README）。"
            echo
            git log "$RANGE" --pretty=format:'- %s'
            echo
          } > changelog.md
          cat changelog.md

      - name: Install Dependencies and Generate latest.yml
        env:
          SKIP_PREPARE: 1
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          pnpm install
          pnpm updater
          echo "--- latest.yml ---"
          cat latest.yml

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: bin/
          merge-multiple: true
        # 每个矩阵任务都会上传一份 latest.yml，这里用发布任务自己生成的覆盖掉
      - name: Remove stale assets when re-releasing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -e
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "已存在 $TAG，先清掉旧资产"
            gh release view "$TAG" --json assets --jq '.assets[].name' | while read -r name; do
              [ -n "$name" ] && gh release delete-asset "$TAG" "$name" -y || true
            done
          fi

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: changelog.md
          files: |
            latest.yml
            bin/dist/*
          make_latest: true
          prerelease: false
          draft: false

      - name: Verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -e
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee /tmp/assets.txt
          fail() { echo "::error::$1"; exit 1; }
          for name in \
            latest.yml \
            "sparkle-windows-${VERSION}-x64-setup.exe" \
            "sparkle-windows-${VERSION}-x64-portable.7z" \
            "sparkle-macos-${VERSION}-x64.pkg" \
            "sparkle-macos-${VERSION}-arm64.pkg" \
            "sparkle-linux-${VERSION}-amd64.deb"
          do
            grep -qx "$name" /tmp/assets.txt || fail "发布资产缺少 $name —— 应用内更新会找不到（见 autoUpdater 的 fileMap）"
          done
          # 应用内更新还会校验资产的 sha256 digest，GitHub 对新上传的资产会自动生成
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.digest // "NO-DIGEST")"' | tee /tmp/digests.txt
          grep -q "NO-DIGEST" /tmp/digests.txt && fail "有资产没有 digest，应用内更新会拒绝下载" || true
          echo "✅ 发布资产齐全且都带 sha256 digest"
